<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor</title><link rel="stylesheet" href="/assets/style.css"><link rel="stylesheet" href="/assets/qr.css"></head><body><header></header><main><h1>Image Compressor</h1><p class="intro">Compress images to a target KB size in your browser.</p><section class="workspace body"><label for="compress-file">Choose image</label><input id="compress-file" type="file" accept=".jpg,.jpeg,.png,.webp"><p>PNG, JPG or WEBP · Up to 10 MB</p><fieldset id="compress-controls" disabled><legend>Image Compressor</legend><label for="compress-target">Target size (KB)</label><input id="compress-target" type="number" min="1" max="10000" value="200" step="1"><label for="compress-format">Output format</label><select id="compress-format"><option value="image/jpeg">JPG</option><option value="image/webp">WEBP</option><option value="image/png">PNG</option></select><label><input id="compress-resize" type="checkbox" checked> <span>Allow smaller dimensions</span></label><p>1 KB = 1,000 bytes. PNG reduces size by resizing; JPG and WEBP can also reduce quality.</p><button class="primary" id="compress-run">Compress image</button></fieldset><p id="compress-status" role="status"></p><p id="compress-stats" role="status"></p><div class="image-comparison"><div><h2>Original</h2><div id="compress-original" class="checker"></div></div><div><h2>Result</h2><div id="compress-result" class="checker"></div></div></div><a id="compress-download" class="primary" download hidden>Download image</a></section></main><script type="module" src="/assets/image-compressor.js"></script></body></html>
