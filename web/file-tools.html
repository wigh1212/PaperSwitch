<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Files</title><link rel="stylesheet" href="/assets/style.css"></head><body><header></header><main><h1>Files</h1><p class="intro">Files</p><section class="workspace body"><label id="ft-label" for="ft-file">Choose PDF</label><input id="ft-file" type="file" accept=".pdf"><p id="ft-limit">PDF: up to 50 MB and 100 pages. Password-protected files are not supported.</p><fieldset id="ft-controls" disabled><div id="ft-pdf"><button id="ft-all" type="button">Select all</button><button id="ft-none" type="button">Clear selection</button><label id="ft-group-label" hidden>Pages per file <input id="ft-group" type="number" value="1" min="1" max="100"></label><label id="ft-angle-label" hidden>Clockwise rotation <select id="ft-angle"><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option></select></label><div id="ft-pages"></div></div><button id="ft-save" class="primary">Save results</button></fieldset><p id="ft-status" role="status"></p><div id="ft-results"></div></section></main><script type="module" src="/assets/file-tools.js"></script></body></html>
